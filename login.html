<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Power Meter - Login</title>
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* CSS Variables for Theming - Matching dashboard theme */
        :root {
            /* Light Theme */
            --primary: #6C5CE7;
            --secondary: #00B894;
            --accent: #FD79A8;
            --background: #F1F2F6;
            --card-bg: #FFFFFF;
            --text-color: #2D3436;
            
            /* Dark Theme */
            --background-dark: #2f3640;
            --card-bg-dark: #353b48;
            --text-color-dark: #f5f6fa;
            
            /* Shadows */
            --card-shadow: 6px 6px 12px rgba(0, 0, 0, 0.1);
            --inset-shadow: inset 5px 5px 10px rgba(0,0,0,0.05), inset -5px -5px 10px rgba(255,255,255,0.7);
            --dark-inset-shadow: inset 5px 5px 10px rgba(0,0,0,0.15), inset -5px -5px 10px rgba(255,255,255,0.05);
        }
        
        /* Base Styles */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--background);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        [data-bs-theme="dark"] body {
            background-color: var(--background-dark);
            color: var(--text-color-dark);
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            transition: all 0.3s;
        }
        
        [data-bs-theme="dark"] .card {
            background-color: var(--card-bg-dark);
            box-shadow: var(--dark-inset-shadow);
        }

        .card-header {
            background-color: var(--primary);
            border-bottom: none;
            text-align: center;
            padding: 20px;
            color: white;
        }

        .card-header h3 {
            margin: 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .card-header i {
            font-size: 1.5rem;
        }
        
        .card-body {
            padding: 2rem;
        }

        /* Auth Toggle Styling */
        .auth-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 10px;
        }
        
        [data-bs-theme="dark"] .auth-toggle {
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        .auth-toggle button {
            border: none;
            background: none;
            padding: 12px 24px;
            cursor: pointer;
            font-weight: 600;
            color: #6c757d;
            position: relative;
            transition: all 0.3s ease;
            outline: none;
        }

        .auth-toggle button:hover {
            color: var(--primary);
        }

        .auth-toggle button.active {
            color: var(--primary);
        }

        .auth-toggle button.active::after {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--primary);
            border-radius: 3px;
        }

        /* Form Styling */
        .auth-form {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .auth-form.active {
            display: block;
            opacity: 1;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }
        
        [data-bs-theme="dark"] .form-control {
            background-color: #2d3748;
            border-color: #4a5568;
            color: #e2e8f0;
        }
        
        [data-bs-theme="dark"] .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        /* Button Styling */
        .btn {
            border-radius: 12px;
            padding: 0.75rem 1.25rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: var(--primary);
            border: none;
        }

        .btn-primary:hover {
            background-color: #5649d1;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(108, 92, 231, 0.3);
        }
        
        /* Loading States */
        .btn .spinner-border {
            width: 1.25rem;
            height: 1.25rem;
            vertical-align: text-bottom;
            margin-right: 0.5rem;
        }
        
        /* Links */
        a {
            color: var(--primary);
            text-decoration: none;
            transition: all 0.2s;
        }

        a:hover {
            color: #5649d1;
            text-decoration: underline;
        }
        
        [data-bs-theme="dark"] a {
            color: #a78bfa;
        }
        
        [data-bs-theme="dark"] a:hover {
            color: #c4b5fd;
        }
        
        /* Dark Mode Toggle */
        .dark-mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .dark-mode-toggle .form-check-input {
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <!-- Dark Mode Toggle -->
    <div class="dark-mode-toggle">
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="darkModeSwitch">
        </div>
    </div>

    <div class="container">
        <div class="login-container mx-auto">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-bolt"></i> Smart Power Meter</h3>
                </div>
                <div class="card-body">
                    <!-- Auth Toggle -->
                    <div class="auth-toggle">
                        <button id="loginToggle" class="active">Login</button>
                        <button id="registerToggle">Register</button>
                    </div>

                    <!-- Login Form -->
                    <form id="loginForm" class="auth-form active">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            </div>
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary">
                                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                Login
                                </button>
                            </div>
                            <div class="text-center">
                            <a href="#" id="forgotPassword">Forgot Password?</a>
                            </div>
                        </form>
                        
                        <!-- Register Form -->
                    <form id="registerForm" class="auth-form">
                        <div class="mb-3">
                            <label for="regEmail" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="regEmail" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="regPassword" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="regPassword" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="regConfirmPassword" class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-check-circle"></i></span>
                                <input type="password" class="form-control" id="regConfirmPassword" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="fullName" class="form-label">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" id="fullName" required>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <span id="registerSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                Register
                            </button>
                            </div>
                        </form>
                </div>
            </div>
            
            <!-- Toast Notification -->
            <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
                <div id="authToast" class="toast align-items-center text-white bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body" id="toastMessage">
                            Error message here.
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- Custom JS -->
    <script>
        // Supabase Initialization
        const supabaseUrl = 'https://juciywnevycylsnqnbmq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1Y2l5d25ldnljeWxzbnFuYm1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU0NTY3NjAsImV4cCI6MjA2MTAzMjc2MH0.jam9COWAITe4d1bYSuIyIp7ii-3R8_SlKoTIO5lwwjQ';
                const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
                
        // DOM Elements
        let loginToggle, registerToggle, loginForm, registerForm;
        let toastInstance = null;

        // Function to show toast notification
        function showToast(message, type = 'danger') {
            const toast = document.getElementById('authToast');
            const toastMessage = document.getElementById('toastMessage');
            
            // Remove existing color classes
            toast.classList.remove('bg-danger', 'bg-success', 'bg-warning');
            
            // Add appropriate color class
            if (type === 'danger') {
                toast.classList.add('bg-danger');
            } else if (type === 'success') {
                toast.classList.add('bg-success');
            } else if (type === 'warning') {
                toast.classList.add('bg-warning');
                toast.classList.add('text-dark');
            }
            
            toastMessage.textContent = message;
            
            // Initialize Bootstrap toast
            if (!toastInstance) {
                toastInstance = new bootstrap.Toast(toast, { delay: 5000 });
            }
            
            toastInstance.show();
        }

        // Function to toggle forms
        function toggleForms(showLogin) {
            console.log('Toggling forms. Show Login:', showLogin);
            if (!loginToggle || !registerToggle || !loginForm || !registerForm) {
                console.error('Toggle elements not found!');
                return;
            }
            
            if (showLogin) {
                loginToggle.classList.add('active');
                registerToggle.classList.remove('active');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                console.log('Login form active');
                } else {
                registerToggle.classList.add('active');
                loginToggle.classList.remove('active');
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
                console.log('Register form active');
            }
        }
        
        // --- Theme Management ---
        const themeSwitch = document.getElementById('darkModeSwitch');
        const currentTheme = localStorage.getItem('theme') ? localStorage.getItem('theme') : null;

        // Apply the saved theme on initial load
        function applyInitialTheme() {
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
                if (themeSwitch) themeSwitch.checked = true;
                console.log('Applied saved dark theme.');
            } else {
                document.documentElement.setAttribute('data-bs-theme', 'light');
                if (themeSwitch) themeSwitch.checked = false;
                console.log('Applied default/saved light theme.');
            }
                }
                
        // Function to switch theme
        function switchTheme(e) {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                console.log('Switched to dark theme.');
                } else {
                document.documentElement.setAttribute('data-bs-theme', 'light');
                localStorage.setItem('theme', 'light');
                console.log('Switched to light theme.');
            }
        }

        // Run after DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM fully loaded and parsed');

            // Apply initial theme
            applyInitialTheme();
            
            // Add listener to the theme switch
            if (themeSwitch) {
                themeSwitch.addEventListener('change', switchTheme);
        }
        
            // Get DOM Elements
            loginToggle = document.getElementById('loginToggle');
            registerToggle = document.getElementById('registerToggle');
            loginForm = document.getElementById('loginForm');
            registerForm = document.getElementById('registerForm');
            
            // Check if elements exist
            if (!loginToggle || !registerToggle || !loginForm || !registerForm) {
                console.error('One or more toggle/form elements not found after DOM load.');
                return;
            }
            
            console.log('Toggle elements found:', { loginToggle, registerToggle, loginForm, registerForm });

            // Attach Event Listeners
            loginToggle.addEventListener('click', (e) => {
                e.preventDefault();
                console.log('Login toggle clicked');
                toggleForms(true);
            });

            registerToggle.addEventListener('click', (e) => {
                e.preventDefault();
                console.log('Register toggle clicked');
                toggleForms(false);
            });

            // Initial state: show login form
            toggleForms(true);

            // Check user function (if needed on this page)
            checkUser();

            // Attach other form submit listeners
            // Login Form Submission
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Show spinner and disable button
                const loginBtn = loginForm.querySelector('button[type="submit"]');
                const loginSpinner = document.getElementById('loginSpinner');
            loginBtn.disabled = true;
                loginSpinner.classList.remove('d-none');
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                console.log('Login submitted:', { email });
                
                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email,
                        password
                });
                
                if (error) {
                        console.error('Login error:', error.message);
                        showToast(error.message, 'danger');
                        return;
                    }
                    
                    showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                        window.location.href = 'dashboard_mvp.html';
                }, 1000);
                
            } catch (error) {
                    console.error('Login exception:', error);
                    showToast('An error occurred during login', 'danger');
                } finally {
                    // Hide spinner and enable button
                loginBtn.disabled = false;
                    loginSpinner.classList.add('d-none');
                }
            });

            // Register Form Submission
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Show spinner and disable button
                const registerBtn = registerForm.querySelector('button[type="submit"]');
                const registerSpinner = document.getElementById('registerSpinner');
                registerBtn.disabled = true;
                registerSpinner.classList.remove('d-none');
                
                // Get form values
                const email = document.getElementById('regEmail').value;
                const password = document.getElementById('regPassword').value;
                const confirmPassword = document.getElementById('regConfirmPassword').value;
                const fullName = document.getElementById('fullName').value;
                
                console.log('Registration submitted:', { email, fullName });
                console.log('Validating password match...');
                
                // Validate password match
                if (password !== confirmPassword) {
                    console.error('Passwords do not match');
                    showToast('Passwords do not match', 'warning');
                    registerBtn.disabled = false;
                    registerSpinner.classList.add('d-none');
                return;
            }
            
                try {
                    // Step 1: Register user with Supabase Auth
                    console.log('Registering user with Supabase Auth...');
                    const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: {
                            data: {
                                full_name: fullName
                            }
                        }
                    });
                    
                    if (authError) {
                        console.error('Registration error:', authError.message);
                        showToast(authError.message, 'danger');
                return;
            }
            
                    console.log('Auth registration successful:', authData);
                    
                    // Step 2: Create profile entry in the profiles table
                    if (authData && authData.user) {
                        console.log('Creating profile entry in the profiles table...');
                        const { error: profileError } = await supabaseClient
                            .from('profiles')
                            .insert([
                                {
                                    id: authData.user.id,
                                    email: email,
                                    full_name: fullName,
                                    role: 'user'
                                }
                            ]);
                            
                        if (profileError) {
                            console.error('Profile creation error:', profileError.message);
                            showToast('Registration successful but profile setup failed. Please contact support.', 'warning');
                return;
            }
            
                        console.log('Profile creation successful');
                    }
                    
                    // Clear form and show success message
                    registerForm.reset();
                    showToast('Registration successful! Please check your email for verification.', 'success');
                    
                    // Switch back to login form
                    setTimeout(() => {
                        toggleForms(true);
                    }, 1500);
                    
                } catch (error) {
                    console.error('Registration exception:', error);
                    showToast('An error occurred during registration', 'danger');
                } finally {
                    // Hide spinner and enable button
                    registerBtn.disabled = false;
                    registerSpinner.classList.add('d-none');
                }
            });

            // Forgot Password Functionality
            const forgotPasswordLink = document.getElementById('forgotPassword');
            if (forgotPasswordLink) {
                forgotPasswordLink.addEventListener('click', async (e) => {
                    e.preventDefault();
                    
                    const email = prompt('Please enter your email address:');
                    if (!email) return;
                    
                    try {
                        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                            redirectTo: window.location.origin + '/login.html'
                });
                
                if (error) {
                            console.error('Password reset error:', error.message);
                            showToast(error.message, 'danger');
                            return;
                        }
                        
                        showToast('Password reset email sent. Please check your inbox.', 'success');
                        
                    } catch (error) {
                        console.error('Password reset exception:', error);
                        showToast('An error occurred while sending the reset email', 'danger');
                    }
                });
            }
        });

        // Function to check if user is already logged in
        async function checkUser() {
            console.log('Checking if user is already logged in...');
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                
                if (session) {
                    console.log('User already logged in. Redirecting to dashboard...');
                    window.location.href = 'dashboard_mvp.html';
                } else {
                    console.log('No active session found.');
                }
            } catch (error) {
                console.error('Session check error:', error);
            }
        }
    </script>
</body>
</html>
